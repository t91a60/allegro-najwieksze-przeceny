<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Największe przeceny Allegro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <p class="kicker">Allegro</p>
    <h1>Automatyczne sortowanie</h1>
    <p class="lead">Od największej przeceny. Nowe oferty po scrollu też wchodzą do sortowania.</p>
    <div class="modes" role="group" aria-label="Automatyczne sortowanie od największej przeceny">
      <button id="off" type="button">OFF</button>
      <button id="on" type="button" aria-pressed="true">ON</button>
    </div>
    <p class="stat" id="stat">Sprawdzam listę ofert…</p>
    <script src="popup.js"></script>
  </body>
</html>
